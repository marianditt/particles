<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles</title>
  </head>
  <body>
    <section id="inputs">
      <label>N (#) <input id="n" type="number" min="1" max="100" step="1" value="3" /></label>
      <label>Direction resolution (°) <input id="res" type="number" min="0.1" max="90" step="0.1" value="5" /></label>
      <label>Time threshold (minutes) <input id="time" type="number" min="1" max="60" step="1" value="1" /></label>
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <span id="error"></span>
    </section>
    <section id="render"><canvas id="canvas"></canvas></section>
    <section id="stats"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
